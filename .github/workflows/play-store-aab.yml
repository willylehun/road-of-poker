name: Build signed Play Store AAB

on:
  workflow_dispatch:

concurrency:
  group: play-store-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0
        with:
          gradle-version: "9.6.0"

      - name: Validate application
        run: |
          node --check dist/app.js
          node --check dist/poker-engine.js
          node --check dist/service-worker.js
          node --check dist/offline.js
          node scripts/validate.mjs
          node tests/poker-engine.test.cjs

      - name: Prepare upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Le secret GitHub $variable doit être configuré avant la création du bundle Play Store."
              exit 1
            fi
          done
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/road-of-poker-upload.jks"
          test -s "$RUNNER_TEMP/road-of-poker-upload.jks"
          chmod 600 "$RUNNER_TEMP/road-of-poker-upload.jks"
          echo "PLAY_UPLOAD_STORE_FILE=$RUNNER_TEMP/road-of-poker-upload.jks" >> "$GITHUB_ENV"

      - name: Check upload signing credentials
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if ! keytool -list -keystore "$PLAY_UPLOAD_STORE_FILE" \
              -storepass:env PLAY_UPLOAD_STORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::PLAY_UPLOAD_STORE_PASSWORD est incorrect, ou le keystore est illisible."
            exit 1
          fi

          if ! keytool -list -keystore "$PLAY_UPLOAD_STORE_FILE" \
              -storepass:env PLAY_UPLOAD_STORE_PASSWORD \
              -alias "$PLAY_UPLOAD_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::PLAY_UPLOAD_KEY_ALIAS est absent du keystore ou ne désigne pas une entrée lisible."
            exit 1
          fi

          csr_file="$RUNNER_TEMP/road-of-poker-key-check.csr"
          trap 'rm -f "$csr_file"' EXIT
          if ! keytool -certreq -keystore "$PLAY_UPLOAD_STORE_FILE" \
              -storepass:env PLAY_UPLOAD_STORE_PASSWORD \
              -alias "$PLAY_UPLOAD_KEY_ALIAS" \
              -keypass:env PLAY_UPLOAD_KEY_PASSWORD \
              -file "$csr_file" >/dev/null 2>&1; then
            echo "::error::PLAY_UPLOAD_KEY_PASSWORD ne déverrouille pas la clé privée associée à PLAY_UPLOAD_KEY_ALIAS."
            exit 1
          fi
          echo "Contrôle des identifiants de signature réussi; aucune valeur secrète n'a été affichée."

      - name: Build signed release bundle
        working-directory: android
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace --warning-mode=all :app:lintRelease :app:bundleRelease

      - name: Verify and checksum bundle
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/bundle/release/app-release.aab road-of-poker-play.aab
          test -s road-of-poker-play.aab
          # Upload keys use a self-signed certificate, so -strict incorrectly fails on the expected trust-chain warning.
          if ! unzip -Z1 road-of-poker-play.aab | grep -Eiq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::Aucune signature de certificat n'a été trouvée dans l'AAB."
            exit 1
          fi
          jarsigner -verify road-of-poker-play.aab
          sha256sum road-of-poker-play.aab > road-of-poker-play.aab.sha256
          sha256sum -c road-of-poker-play.aab.sha256

      - name: Upload verified Play Store bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: road-of-poker-play-aab
          path: |
            road-of-poker-play.aab
            road-of-poker-play.aab.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/road-of-poker-upload.jks"
