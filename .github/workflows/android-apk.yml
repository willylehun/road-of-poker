name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "dist/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0
        with:
          gradle-version: "9.6.0"

      - name: Validate web application
        run: |
          node --check dist/app.js
          node --check dist/poker-engine.js
          node --check dist/service-worker.js
          node --check dist/offline.js
          node scripts/validate.mjs
          node tests/poker-engine.test.cjs

      - name: Lint and build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --warning-mode=all :app:lintDebug :app:assembleDebug

      - name: Prepare and verify APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk road-of-poker.apk
          sha256sum road-of-poker.apk > road-of-poker.apk.sha256
          test -s road-of-poker.apk
          sha256sum -c road-of-poker.apk.sha256

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: road-of-poker-apk
          path: |
            road-of-poker.apk
            road-of-poker.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: road-of-poker-apk

      - name: Verify APK checksum
        run: sha256sum -c road-of-poker.apk.sha256

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" road-of-poker.apk road-of-poker.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" road-of-poker.apk road-of-poker.apk.sha256 --repo "$GITHUB_REPOSITORY" --title "Road of Poker Android 1.3.0" --notes "APK Android installable de Road of Poker. Vérifiez son intégrité avec le fichier SHA-256 joint."
          fi
