name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk road-of-poker.apk
          tag="android-${GITHUB_SHA::7}"
          gh release create "$tag" road-of-poker.apk --title "Road of Poker Android" --notes "APK Android installable de Road of Poker."
