plugins {
    id "com.android.application"
}

def playSigningEnvironment = [
    "PLAY_UPLOAD_STORE_FILE",
    "PLAY_UPLOAD_STORE_PASSWORD",
    "PLAY_UPLOAD_KEY_ALIAS",
    "PLAY_UPLOAD_KEY_PASSWORD"
]
def playSigningConfigured = playSigningEnvironment.every { System.getenv(it) }

android {
    namespace "com.byw.roadofpoker"
    compileSdk 36

    defaultConfig {
        applicationId "com.byw.roadofpoker"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "1.5.0"
    }

    signingConfigs {
        if (playSigningConfigured) {
            create("playRelease") {
                storeFile file(System.getenv("PLAY_UPLOAD_STORE_FILE"))
                storePassword System.getenv("PLAY_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("PLAY_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("PLAY_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            debuggable false
            minifyEnabled false
            if (playSigningConfigured) {
                signingConfig signingConfigs.getByName("playRelease")
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
